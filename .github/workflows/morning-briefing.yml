name: Morning Briefing Auto-Update

on:
  schedule:
    # 05:00 UTC = 07:00 svensk sommartid. Vardagar (mån-fre).
    - cron: '0 5 * * 1-5'
  workflow_dispatch:   # Manuell körning via knapp i GitHub (Actions-fliken)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kör briefing-uppdatering
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_briefing.py

      - name: Committa och pusha om index.html ändrats
        run: |
          git config user.name "Briefing Bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Inga ändringar idag."
          else
            git commit -m "Morning briefing auto-update $(date +'%Y-%m-%d')"
            git push
          fi

